name = "emberblood-api"
main = "src/index.js"
compatibility_date = "2025-09-01"
workers_dev = true

[vars]
ALLOWED_ORIGINS = "https://playemberblood.com,https://www.playemberblood.com,https://muellercodes.github.io"
ADMIN_USERS = "MuellerCodes"   # accounts that can use admin.html (comma separated)
TURNSTILE_SITEKEY = "0x4AAAAAAFkqSEhGv0ws-n2k"   # public; the secret is the Worker secret TURNSTILE_SECRET (never in the repo)

[[d1_databases]]
binding = "DB"
database_name = "emberblood"
database_id = "57d702d0-52d6-486f-9061-a99b5cb50e6f"

[triggers]
crons = ["17 4 * * *"]
