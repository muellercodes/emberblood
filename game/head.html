<title>Emberblood</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Rubik:wght@400;500;700;800&display=swap">
<style>
/* Layout: full-bleed canvas arena, DOM overlays for menus, dialogue and choices. Single dark look by design. */
:root{
  --bg:#0b0607; --ink:#f6e9d6; --muted:#bca790; --ember:#ff7a2f; --gold:#ffc35a;
  --panel:rgba(22,11,9,.93); --edge:#6d3421; --btn:#2a130d; --btn-hi:#3d1a10; --hot-a:#b9461d; --hot-b:#7a2410;
  --f-display:'Cinzel',Georgia,'Times New Roman',serif; --f-ui:'Rubik',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-ui);overflow:hidden;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#game{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:crosshair;background:var(--bg)}
#safe{position:fixed;inset:0;pointer-events:none;visibility:hidden;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
.ov{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:16px;padding-top:max(16px,env(safe-area-inset-top,0px));padding-bottom:max(16px,env(safe-area-inset-bottom,0px));z-index:5;overflow-y:auto}
.ov.on{display:flex}
.dim{background:rgba(8,3,3,.66)}
#menu{background:radial-gradient(ellipse at 50% 42%,rgba(11,6,7,.05) 0%,rgba(11,6,7,.55) 55%,rgba(11,6,7,.92) 100%)}
.menu{width:100%;max-width:640px;text-align:center;margin:auto}
.menu .stack,.menu .best{max-width:440px;margin-left:auto;margin-right:auto}
.logo{font-family:var(--f-display);font-weight:800;font-size:clamp(34px,8.5vw,72px);letter-spacing:.05em;line-height:1;margin:0;white-space:nowrap;padding:0 8px;background:linear-gradient(180deg,#fff2cf 0%,#ffc35a 38%,#e8521f 72%,#8a1d0f 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 6px 24px rgba(255,90,30,.35))}
.tag{font-family:var(--f-display);font-weight:600;color:var(--gold);letter-spacing:.32em;text-transform:uppercase;font-size:clamp(11px,2.8vw,14px);margin:12px 0 24px}
.stack{display:flex;flex-direction:column;gap:10px}
.row{display:flex;gap:10px}
.row>*{flex:1;min-width:0}
.btn{display:block;width:100%;font:inherit;font-weight:700;font-size:17px;color:var(--ink);background:linear-gradient(180deg,var(--btn-hi),var(--btn));border:1px solid var(--edge);border-radius:10px;padding:12px 16px;margin:0;cursor:pointer;text-align:left;transition:border-color .15s,transform .08s}
.btn small{display:block;font-weight:400;font-size:13px;color:var(--muted);margin-top:3px}
.btn:hover{border-color:var(--ember)}
.btn:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.btn:active{transform:translateY(1px)}
.btn.hot{background:linear-gradient(180deg,var(--hot-a),var(--hot-b));border-color:#ff9a52}
.btn.hot small{color:#ffd9b8}
.btn.c{text-align:center}
.btn.sm{font-size:15px;padding:10px 12px}
.diff{display:flex;align-items:center;gap:10px;justify-content:space-between;margin-top:4px;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.14em}
.seg{display:flex;border:1px solid var(--edge);border-radius:9px;overflow:hidden}
.seg button{font:inherit;font-size:14px;font-weight:500;color:var(--muted);background:var(--btn);border:0;padding:8px 14px;cursor:pointer;letter-spacing:0;text-transform:none}
.seg button+button{border-left:1px solid var(--edge)}
.seg button[aria-pressed="true"]{background:var(--hot-b);color:var(--ink)}
.seg button:focus-visible{outline:2px solid var(--gold);outline-offset:-2px}
.note{font-size:13px;color:var(--muted);margin:0;min-height:1.3em;text-align:left}
.best{font-size:13px;color:var(--muted);margin-top:16px;font-variant-numeric:tabular-nums;min-height:1.2em}
.panel{background:var(--panel);border:1px solid var(--edge);border-radius:14px;box-shadow:0 24px 70px rgba(0,0,0,.6);padding:22px;width:100%;max-width:420px;margin:auto}
.panel.w{max-width:780px}
.panel h2{font-family:var(--f-display);font-weight:800;font-size:28px;margin:0 0 6px;color:var(--gold);letter-spacing:.04em;text-wrap:balance}
.panel h3{font-family:var(--f-display);font-size:14px;letter-spacing:.14em;text-transform:uppercase;color:var(--ember);margin:16px 0 8px}
.panel p{color:var(--muted);line-height:1.5;margin:0 0 14px}
.center{text-align:center}
.keys{display:grid;grid-template-columns:auto 1fr;gap:7px 14px;font-size:14px;line-height:1.35;align-items:baseline}
.keys kbd{font-family:var(--f-ui);font-weight:700;color:var(--ink);background:#3a1a10;border:1px solid var(--edge);border-bottom-width:2px;border-radius:5px;padding:1px 6px;font-size:12px;white-space:nowrap}
.keys span{color:var(--muted)}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:22px}
.cols>*{min-width:0}
.tips{margin:0;padding-left:18px;color:var(--muted);line-height:1.5;font-size:14px}
.tips li+li{margin-top:4px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:6px 0 18px;font-variant-numeric:tabular-nums}
.stat{background:rgba(0,0,0,.3);border:1px solid rgba(255,140,70,.15);border-radius:8px;padding:8px 10px;text-align:left}
.stat b{display:block;font-size:20px;color:var(--ink)}
.stat span{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
#dialogue{align-items:flex-end;background:linear-gradient(180deg,rgba(8,3,3,0) 35%,rgba(8,3,3,.78) 100%);cursor:pointer;padding-top:60px}
.dlg{position:relative;display:flex;gap:16px;align-items:flex-start;width:100%;max-width:780px;margin:0 auto;background:var(--panel);border:1px solid var(--edge);border-radius:14px;padding:16px 18px 30px;box-shadow:0 20px 60px rgba(0,0,0,.6)}
.dlg:focus-visible{outline:2px solid var(--gold)}
#portrait{width:92px;height:92px;flex:none;border-radius:10px;border:1px solid var(--edge);background:#1a0c08}
.dtext{min-width:0;flex:1}
.who{font-family:var(--f-display);font-weight:800;letter-spacing:.06em;font-size:16px;margin:2px 0 6px;min-height:1.2em}
.say{font-size:18px;line-height:1.5;min-height:4.5em}
.dlg.narr .say{font-style:italic;color:#e8d8bf}
.next{position:absolute;right:16px;bottom:9px;font-size:12px;color:var(--muted);letter-spacing:.06em}
.skip{position:absolute;right:0;top:-44px;font:inherit;font-size:13px;font-weight:500;color:var(--ink);background:rgba(22,11,9,.88);border:1px solid var(--edge);border-radius:8px;padding:7px 12px;cursor:pointer}
.skip:focus-visible{outline:2px solid var(--gold)}
#card{flex-direction:column;pointer-events:none;text-align:center;z-index:4}
#card.on{animation:card 2.8s ease forwards}
#card .num{font-family:var(--f-display);font-weight:600;letter-spacing:.45em;text-transform:uppercase;color:var(--gold);font-size:clamp(13px,3.2vw,18px);margin-bottom:10px}
#card .nm{font-family:var(--f-display);font-weight:800;font-size:clamp(30px,7.5vw,66px);line-height:1.05;color:var(--ink);text-shadow:0 4px 30px rgba(255,90,30,.5),0 2px 0 #000;text-wrap:balance;max-width:16ch}
@keyframes card{0%{opacity:0;transform:translateY(8px)}14%{opacity:1;transform:none}78%{opacity:1}100%{opacity:0}}
.upw{width:100%;max-width:820px;margin:auto;text-align:center}
.upw h2{font-family:var(--f-display);font-weight:800;color:var(--gold);font-size:clamp(26px,5vw,38px);margin:0 0 4px}
.upw p{color:var(--muted);margin:0 0 20px}
.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.card{position:relative;font:inherit;color:var(--ink);background:linear-gradient(180deg,#341710,#1e0d09);border:1px solid var(--edge);border-radius:14px;padding:24px 16px 18px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;transition:transform .12s,border-color .15s}
.card:hover,.card:focus-visible{border-color:var(--gold);transform:translateY(-3px);outline:none}
.card .ico{font-size:34px;line-height:1}
.card .txt{display:flex;flex-direction:column;gap:6px;align-items:center;min-width:0}
.card .nm{font-family:var(--f-display);font-weight:800;font-size:17px;letter-spacing:.03em}
.card .ds{font-size:14px;color:var(--muted);line-height:1.4}
.card .lv{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ember)}
.card .k{position:absolute;top:8px;left:10px;font-size:11px;color:var(--muted);border:1px solid var(--edge);border-radius:4px;padding:0 5px}
@media (max-width:640px){
  .cards{grid-template-columns:1fr;gap:10px}
  .card{flex-direction:row;text-align:left;padding:14px 14px 14px 38px;gap:14px}
  .card .txt{align-items:flex-start;gap:3px}
  .cols{grid-template-columns:1fr;gap:6px}
  #portrait{width:62px;height:62px}
  .say{font-size:16px}
  .dlg{gap:12px;padding:12px 14px 28px}
}
@media (prefers-reduced-motion:reduce){.card,.btn{transition:none}}
